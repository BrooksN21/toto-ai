[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toto-ai"
version = "0.1.0"
description = "Python client and CLI for the TotoBrief community API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests",
    "typer",
    "rich",
    "pandas",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
toto-ai = "toto_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not heavy'"
markers = [
    "heavy: multi-minute full-surface or real-pipeline validation; opt-in/nightly",
    "research: non-release frozen or offline research validation",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
